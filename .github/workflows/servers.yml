# Rebuilds the signed server list every 4 hours and publishes it to the "data"
# branch, served to the app by raw.githubusercontent.com and the jsDelivr CDN.
name: server-list

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y openvpn
      - run: pip install cryptography
      - name: Build list
        env:
          SERVER_LIST_KEY: ${{ secrets.SERVER_LIST_KEY }}
        run: |
          if [ -z "$SERVER_LIST_KEY" ]; then echo "::error::Secret SERVER_LIST_KEY is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          cd backend
          printf '%s\n' "$SERVER_LIST_KEY" > /tmp/key.pem
          # Root is needed for the tunnels; keep the setup-python interpreter (it has cryptography).
          sudo -E "$(which python)" build_list.py --key /tmp/key.pem --out ../public/servers.json --verify
          rm /tmp/key.pem
      - name: Publish to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init -q -b data
          git config user.name "volta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers.json
          git commit -qm "server list $(date -u +%Y-%m-%dT%H:%MZ)"
          # Single-commit orphan branch: history never grows.
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - name: Refresh jsDelivr cache
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/servers.json" || true
