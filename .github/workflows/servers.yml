# Rebuilds and publishes the signed server list every 4 hours (GitHub Pages).
name: server-list

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y openvpn
      - run: pip install cryptography
      - name: Build list
        env:
          SERVER_LIST_KEY: ${{ secrets.SERVER_LIST_KEY }}
        run: |
          if [ -z "$SERVER_LIST_KEY" ]; then echo "::error::Secret SERVER_LIST_KEY is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          cd backend
          printf '%s
' "$SERVER_LIST_KEY" > /tmp/key.pem
          # Root is needed for the tunnels; keep the setup-python interpreter (it has cryptography).
          sudo -E "$(which python)" build_list.py --key /tmp/key.pem --out ../public/servers.json --verify
          rm /tmp/key.pem
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
