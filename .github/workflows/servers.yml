# Rebuilds and publishes the signed server list every 4 hours (GitHub Pages).
name: server-list

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y openvpn
      - run: pip install cryptography
      - name: Build list
        env:
          SERVER_LIST_KEY: ${{ secrets.SERVER_LIST_KEY }}
        run: |
          cd backend
          printf '%s' "$SERVER_LIST_KEY" > /tmp/key.pem
          sudo -E python3 build_list.py --key /tmp/key.pem --out ../public/servers.json --verify
          rm /tmp/key.pem
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
